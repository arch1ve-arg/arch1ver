<h1>THE LEDGER</h1>
<p>Locked. I never could remember strong passwords, so I picked something everyone uses. I only kept its fingerprint:</p>
<p><code>MD5: d5c0607301ad5d5c1528962a83992ac8</code></p>
<p>The password is also the name of the next room. Enter it to walk through.</p>
<input id="p" placeholder="password"> <button onclick="go()">open</button>
<p id="m" class="dim"></p>
<script>function go(){var v=document.getElementById('p').value.trim().toLowerCase().replace(/[^a-z0-9]/g,'');if(v)location.href=v+'/';}</script>
</body></html>
